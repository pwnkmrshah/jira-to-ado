services:
  - type: web
    name: jira-to-ado
    runtime: docker
    
    # Environment variables (set these in Render dashboard)
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MIGRATION_API_KEY
        sync: false  # Keep as secret, don't sync from git
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
