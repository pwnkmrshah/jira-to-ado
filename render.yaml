services:
  - type: web
    name: jira-to-ado
    runtime: python
    pythonVersion: 3.11
    
    # Build commands
    buildCommand: |
      pip install -r requirements.txt && \
      cd web-ui && npm install && npm run build && cd ..
    
    # Start command
    startCommand: "python api_server.py"
    
    # Environment
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
