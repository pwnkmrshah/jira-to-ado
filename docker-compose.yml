version: '3.8'

services:
  # Backend API service
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jira-ado-api
    ports:
      - "10000:10000"
    environment:
      FLASK_ENV: development
      PORT: 10000
      MIGRATION_API_KEY: ${MIGRATION_API_KEY:-dev-secret-key-change-in-prod}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      PYTHONUNBUFFERED: 1
    volumes:
      - ./api:/app/api
      - ./api_server.py:/app/api_server.py
      - ./config:/app/config
      - ./utilities:/app/utilities
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Frontend UI service
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jira-ado-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://api:10000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s


