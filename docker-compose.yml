version: '3.8'

services:
  # Backend API service
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "10000:10000"
    environment:
      FLASK_ENV: production
      PORT: 10000
      MIGRATION_API_KEY: ${MIGRATION_API_KEY:-dev-key}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    volumes:
      - ./config:/app/config
    restart: unless-stopped

  # Frontend UI service
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://api:10000
    depends_on:
      - api
    restart: unless-stopped

